name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: Claude posts the summary with `gh pr comment`
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # full history: the review reads git blame/log for historical context
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review the current pull request for bugs, regressions, security issues, and violations of
            repository guidance. Review the current diff even if Claude commented on an earlier commit.
            Ignore issues that were already reported and remain unchanged.

            Always publish exactly one top-level summary with `gh pr comment`, even when no findings
            remain. Include the findings, or explicitly say that no issues were found. End that comment
            with this exact marker on its own line:

            <!-- claude-review:${{ github.event.pull_request.head.sha }} -->

            Use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true` for each
            actionable line-specific finding. Do not finish until `gh pr comment` returns the URL of the
            published summary.

            Triggered by `${{ github.event.action }}` on commit ${{ github.event.pull_request.head.sha }}.
          # --allowed-tools replaces the default set. Task enables review
          # subagents; the GitHub tools publish the required summary and findings.
          claude_args: '--verbose --allowed-tools "Task,Read,Grep,Glob,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Verify review summary was published
        # Workflow edits are intentionally skipped until this file matches the
        # default branch. A real Claude run always produces an execution file.
        if: >-
          always() &&
          steps.claude-review.outcome == 'success' &&
          steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_MARKER: '<!-- claude-review:${{ github.event.pull_request.head.sha }} -->'
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq '.[].body' | grep -Fq "${REVIEW_MARKER}"; then
            echo "::error::Claude review completed without publishing its required PR summary."
            exit 1
          fi

